name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Put files in place
        run: |
          mkdir -p www assets
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Kasturi Nagar</title></head><body><script>location.replace("https://kasturinagar.badiyo.com");</script></body></html>' > www/index.html
          mv icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
          ls -R www assets

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Make app icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Yellow splash screen for Android 12 and above
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/icon-foreground.png android/app/src/main/res/drawable-nodpi/splash_icon.png
          sed -i 's|<item name="android:background">@drawable/splash</item>|<item name="android:background">@drawable/splash</item>\n        <item name="windowSplashScreenBackground">#FDDA01</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>|' android/app/src/main/res/values/styles.xml
          grep -n "windowSplashScreen" android/app/src/main/res/values/styles.xml
          test "$(grep -c windowSplashScreenAnimatedIcon android/app/src/main/res/values/styles.xml)" = "1"

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: kasturinagar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
